<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>弹唱谱 · 尤克里里 / 吉他</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
  :root {
    /* 界面和谱面共用同一套中文无衬线字体：鸿蒙黑体 / 苹方 / 微软雅黑 / 思源黑体 */
    --font: "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    --bg: #f3f1ec;
    --panel: #ffffff;
    --ink: #1e1c19;
    --muted: #726c63;
    --line: #e4e0d8;
    --chip: #f0ede6;
    --accent: #e8590c;
    --accent-ink: #ffffff;
    --accent-soft: rgba(232, 89, 12, 0.12);
    --paper: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 24px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161519;
      --panel: #211f25;
      --ink: #ece9e3;
      --muted: #a09a91;
      --line: #35323a;
      --chip: #2b2930;
      --accent: #ff8a3d;
      --accent-ink: #1b1208;
      --accent-soft: rgba(255, 138, 61, 0.16);
      --paper: #fbfaf7; /* 谱面保持纸白，黑色符号才清楚 */
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; overflow-x: clip; } /* 用 clip 不用 hidden：hidden 会让顶栏的 sticky 失效 */
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 var(--font);
    padding-bottom: calc(45vh + env(safe-area-inset-bottom)); /* 留够空白，最后几行也能滚到上面 */
    -webkit-font-smoothing: antialiased;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- 通用按钮 ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 34px; padding: 0 12px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    cursor: pointer; white-space: nowrap; font-size: 14px;
    transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn.icon { width: 34px; padding: 0; justify-content: center; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; border-radius: 8px; height: 28px; padding: 0 10px;
    cursor: pointer; font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

  /* ---------- 顶栏 ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .hbar { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .song { display: flex; flex-direction: column; min-width: 0; flex: 1 1 220px; }
  .song-btn {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left;
    font-size: 18px; font-weight: 700;
  }
  .song-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-btn svg.i { width: 16px; height: 16px; color: var(--muted); }
  .song-btn:hover span { color: var(--accent); }

  /* 曲库面板（从左边滑出） */
  .drawer.left { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--line); transform: translateX(-105%); box-shadow: 8px 0 32px rgba(0,0,0,.15); width: min(420px, 100vw); }
  .drawer.left.open { transform: none; }
  .search {
    width: 100%; height: 38px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .song-list { display: flex; flex-direction: column; gap: 6px; }
  .song-item {
    display: flex; flex-direction: column; gap: 4px; text-align: left;
    padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer;
  }
  .song-item:hover { border-color: var(--accent); }
  .song-item.cur { border-color: var(--accent); background: var(--accent-soft); }
  .song-item .t { font-size: 16px; font-weight: 700; }
  .song-item .a { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .song-item .chips { margin: 0; }
  .song-item .draft { color: var(--accent); }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  .chip { font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 8px; }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ---------- 谱面 ---------- */
  main { padding: 16px; max-width: 1280px; margin: 0 auto; }
  .paper {
    background: var(--paper); color: #111;
    border-radius: 14px; box-shadow: var(--shadow);
    padding: 16px 8px; min-height: 60vh; position: relative; overflow-x: auto; overflow-y: hidden;
  }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #777; font-size: 14px; pointer-events: none;
  }
  #status[hidden] { display: none; }

  /* alphaTab 光标 / 高亮 */
  .at-cursor-bar { background: rgba(232, 89, 12, 0.07); }
  .at-selection div { background: rgba(232, 89, 12, 0.15); }
  .at-cursor-beat { background: #e8590c; width: 3px; border-radius: 2px; }
  .at-highlight * { fill: #e8590c; stroke: #e8590c; }

  /* 自绘弹唱谱：alphaTab 仍在页面外排版（给播放器用），显示的是 #custom */
  /* alphaTab 会在元素上写内联 position: relative，这里要 !important 才压得住 */
  .paper.custom #at { position: absolute !important; left: -20000px; top: 0; width: 1000px; }
  .paper:not(.custom) #custom { display: none; }
  #custom { color: #111; }
  .uke-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 4px 16px 10px; }
  .uke-head .t { text-align: center; }
  .uke-head h1 { font-size: 24px; margin: 0; font-weight: 700; }
  .uke-head .sub { font-size: 13px; color: #555; }
  .uke-head .l { font-size: 13px; line-height: 1.5; color: #222; }
  .uke-head .r { font-size: 13px; text-align: right; color: #444; }
  /* 谱面底部署名：截图、打印都带着 */
  .uke-credit { text-align: right; font-size: 11px; color: #999; padding: 6px 16px 0; }
  .uke-credit a { color: inherit; }
  /* 不在作者自己的网址上打开时，顶部显示一条署名（只是提示，可以关掉） */
  .cred-banner { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 12px; font-size: 12px; color: var(--muted); background: var(--chip); border-bottom: 1px solid var(--line); }
  .cred-banner a { color: var(--accent); }
  .cred-banner button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; }
  .uke-svg { display: block; cursor: pointer; }
  .uke-svg .uke-hl { fill: #e8590c; }
  /* 箭头头部、琶音波浪线是只描边的线条，要改描边色（填充保持透明） */
  .uke-svg path.uke-hl { fill: none; stroke: #e8590c; }
  @media (max-width: 640px) { .uke-head h1 { font-size: 19px; } .uke-head { padding: 2px 10px 8px; } }

  /* ---------- 底部播放条（浮动卡片） ---------- */
  .player {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30;
    width: min(1040px, calc(100vw - 24px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.14);
    padding: 10px 14px; display: flex; flex-direction: column; gap: 8px;
  }
  .prow { display: flex; align-items: center; gap: 10px; }
  /* 播放中收起：只留一条，半透明毛玻璃，不挡谱 */
  .player { transition: padding .2s, background .2s; }
  .player.mini { padding: 6px 10px; background: color-mix(in srgb, var(--panel) 72%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .player.mini .tools, .player.mini .vol-pop { display: none; }
  .player.mini .play { width: 36px; height: 36px; }
  .player.mini .play svg { width: 16px; height: 16px; }
  #expandBtn { display: none; }
  .player.mini #expandBtn { display: inline-flex; }
  .play {
    width: 44px; height: 44px; border-radius: 50%; border: 0; flex: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(232, 89, 12, .35);
  }
  .play svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
  .play:disabled { opacity: .45; cursor: default; box-shadow: none; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .progress { flex: 1; accent-color: var(--accent); min-width: 60px; }
  .tools { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .tools::-webkit-scrollbar { display: none; }
  .tools .sep { width: 1px; height: 20px; background: var(--line); flex: none; }
  .zoom { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .tempo { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  .tempo .bpm { font-size: 14px; white-space: nowrap; }
  .tempo input {
    width: 48px; height: 30px; text-align: center; font: inherit; font-weight: 700; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 8px; background: var(--chip); color: var(--ink); -moz-appearance: textfield;
  }
  .tempo input::-webkit-inner-spin-button, .tempo input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .tempo input.changed { color: var(--accent); border-color: var(--accent); }
  .zoom span { font-size: 12px; color: var(--muted); min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
  #sfInfo { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: auto; }

  /* 音量面板：浮在播放条上方 */
  .vol-pop {
    position: absolute; bottom: calc(100% + 8px); left: 14px; z-index: 31;
    width: min(340px, calc(100vw - 48px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.16); padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .vol-pop .vrow { display: grid; grid-template-columns: 64px 1fr 44px 34px; align-items: center; gap: 8px; }
  .vol-pop .vname { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vol-pop input[type=range] { width: 100%; accent-color: var(--accent); }
  .vol-pop .vval { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .vol-pop .vtitle { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .vol-pop .vtitle button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 12px; padding: 0; }

  /* ---------- 抽屉：编辑器 / 声部 ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
    width: min(560px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    box-shadow: -8px 0 32px rgba(0,0,0,.15);
    transform: translateX(105%); transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  .drawer .head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .drawer .head h2 { font-size: 16px; margin: 0; flex: 1; }
  .drawer .body { flex: 1; overflow: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  code { background: var(--chip); border-radius: 4px; padding: 0 4px; font-size: 12px; }

  /* ---------- 写谱栏：左边写，右边就是播放器的谱面 ---------- */
  :root { --edw: min(480px, 40vw); --edh: 44vh; --hdr: 64px; --edfs: 13px; --edlh: 21px; }
  .edit-pane {
    position: fixed; left: 0; top: var(--hdr); bottom: 0; width: var(--edw); z-index: 25;
    background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  /* 写谱栏右边的拖动条（窄屏时在下边，拖高度） */
  .resizer { position: absolute; top: 0; bottom: 0; right: -5px; width: 10px; cursor: col-resize; z-index: 2; touch-action: none; }
  .resizer::after { content: ''; position: absolute; inset: 0; margin: auto; width: 3px; height: 100%; background: transparent; transition: background .15s; }
  .resizer:hover::after, .resizer.drag::after { background: var(--accent); }
  @media (max-width: 860px) { .resizer::after { width: 100%; height: 3px; } }
  body.resizing { user-select: none; cursor: col-resize; }
  .edit-bar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .edit-bar .grow { flex: 1; }
  .edit-bar select { flex: 0 1 260px; min-width: 0; } /* 显示当前谱子名，有空间就放宽，窄了就截断 */
  .editor { flex: 1; min-height: 0; display: flex; background: var(--bg); }
  .gutter {
    padding: 10px 6px 10px 8px; min-width: 38px; text-align: right; color: var(--muted); user-select: none;
    font: var(--edfs)/var(--edlh) "Cascadia Mono", Consolas, ui-monospace, monospace; white-space: pre; overflow: hidden;
    border-right: 1px solid var(--line);
  }
  /* 上色：文字框本身透明（只显示光标），底下垫一层上了颜色的同样文字 */
  .code { position: relative; flex: 1; min-width: 0; }
  .code pre, textarea#src {
    position: absolute; inset: 0; margin: 0; border: 0; padding: 10px 12px;
    white-space: pre; tab-size: 4; font: var(--edfs)/var(--edlh) "Cascadia Mono", Consolas, ui-monospace, "Microsoft YaHei", monospace;
  }
  .code pre { overflow: hidden; color: var(--ink); pointer-events: none; }
  textarea#src {
    outline: none; resize: none; background: transparent; overflow: auto;
    color: transparent; caret-color: var(--ink); -webkit-text-fill-color: transparent;
  }
  textarea#src::selection { background: rgba(232, 89, 12, .25); }
  .hl-sep { color: var(--accent); background: var(--accent-soft); display: inline-block; min-width: 100%; }
  .hl-cmt { color: var(--muted); }
  .hl-key { color: #1c7ed6; }
  .hl-bar { color: var(--accent); }
  .hl-sec { color: #2b8a3e; }
  @media (prefers-color-scheme: dark) { .hl-key { color: #74c0fc; } .hl-sec { color: #69db7c; } }

  /* 写谱栏底部：自动保存的状态 */
  .save-state { padding: 6px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .save-state.err { color: #c92a2a; }
  /* 曲库抽屉里「我的谱子」「曲库」的分组标题 */
  .list-head { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }
  .msgs { max-height: 28%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 12px; font-size: 13px; }
  .msgs .ok { color: #2b8a3e; }
  .msgs button { display: block; width: 100%; text-align: left; border: 0; background: none; color: #c92a2a; padding: 2px 0; cursor: pointer; font-size: 13px; }
  .msgs button:hover { text-decoration: underline; }
  body.editing main { margin-left: var(--edw); max-width: none; }
  body.editing .player { left: calc(var(--edw) + (100vw - var(--edw)) / 2); width: min(1000px, calc(100vw - var(--edw) - 24px)); }
  @media (max-width: 860px) {
    /* 窄屏：写谱栏放上面，谱面在下面 */
    .edit-pane { width: 100vw; bottom: auto; height: var(--edh); border-right: 0; border-bottom: 1px solid var(--line); }
    body.editing main { margin-left: 0; padding-top: calc(var(--edh) + 8px); }
    .resizer { top: auto; bottom: -5px; left: 0; right: 0; width: auto; height: 10px; cursor: row-resize; }
    body.editing .player { left: 50%; width: calc(100vw - 24px); }
  }
  .hint { font-size: 13px; color: var(--muted); }
  .track { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .track .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .track strong { flex: 1; }
  .track label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 35; display: none; }
  .scrim.show { display: block; }

  @media (max-width: 640px) {
    .hbar { padding: 8px 12px; gap: 8px; }
    .song-btn { font-size: 16px; }
    .actions .label { display: none; }
    .actions .btn { width: 34px; padding: 0; justify-content: center; }
    main { padding: 8px; }
    .paper { padding: 8px 0; border-radius: 10px; }
    .player { padding: 8px 10px; border-radius: 16px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    .hide-sm { display: none !important; }
  }
</style>
</head>

  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>

<script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/alphaTab.min.js"></script>
<script src="songtex.js"></script>
<script src="ukerender.js"></script>
<script src="scorestore.js"></script>
<script src="songs/library.js"></script>
<script>
(function () {
  'use strict';
  const CDN = 'https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.8.4/dist/';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ } },
  };

  const status = $('status');
  const showStatus = (t) => { status.textContent = t; status.hidden = !t; };

  if (!window.alphaTab) {
    showStatus('谱面引擎加载失败：请检查网络（需要访问 cdn.jsdelivr.net）');
    return;
  }

  // ---------- alphaTab 初始化 ----------
  const api = new alphaTab.AlphaTabApi($('at'), {
    core: {
      fontDirectory: CDN + 'font/',
      scriptFile: CDN + 'alphaTab.min.js',
      enableLazyLoading: false, // 谱子不长，一次画完，截图/打印也完整
      includeNoteBounds: true,  // 画扫弦箭头要用到每个音的位置
    },
    display: {
      scale: parseFloat(store.get('uk.scale')) || (innerWidth < 640 ? 0.6 : 1.0),
      layoutMode: alphaTab.LayoutMode.Page,
    },
    player: {
      playerMode: alphaTab.PlayerMode.EnabledSynthesizer,
      enablePlayer: true,
      enableCursor: true,
      enableAnimatedBeatCursor: true,
      enableUserInteraction: true,
      soundFont: CDN + 'soundfont/sonivox.sf2',
      scrollOffsetY: -110,
    },
  });
  window.api = api; // 方便在控制台调试

  // alphaTab 默认用西式排版字体：文字是 Georgia 衬线体，歌词/和弦名还是斜体。
  // 这里全部换成中文无衬线正体，字号按中文弹唱谱的习惯调大一点。
  (function useChineseFonts() {
    const SANS = getComputedStyle(document.documentElement).getPropertyValue('--font').trim();
    const { Font, FontStyle, FontWeight } = alphaTab.model;
    const NE = alphaTab.NotationElement;
    const R = api.settings.display.resources;
    const f = (size, bold) => new Font(SANS, size, FontStyle.Plain, bold ? FontWeight.Bold : FontWeight.Regular);
    for (const [el, def] of alphaTab.RenderingResources.defaultFonts) {
      R.elementFonts.set(el, f(def.size, def.weight === FontWeight.Bold));
    }
    R.elementFonts.set(NE.ScoreTitle, f(28, true));
    R.elementFonts.set(NE.ScoreSubTitle, f(15));
    R.elementFonts.set(NE.ScoreArtist, f(15));
    R.elementFonts.set(NE.EffectLyrics, f(13));
    R.elementFonts.set(NE.EffectChordNames, f(14, true));
    R.elementFonts.set(NE.ChordDiagrams, f(13, true));
    R.elementFonts.set(NE.EffectText, f(14));
    R.elementFonts.set(NE.EffectMarker, f(14, true));
    R.effectFont = f(12);
    R.fingeringFont = f(12);
    R.inlineFingeringFont = f(12);
    R.numberedNotationFont = f(17);
    R.numberedNotationGraceFont = f(13);
    R.tablatureFont = f(13);
    R.graceFont = f(11);
    api.updateSettings();
  })();

  // ---------- 自绘弹唱谱（ukerender.js） ----------
  // alphaTab 照常在页面外排版并负责播放；这里读它解析好的 Score 自己画一份给人看
  let compiled = null;       // 最近一次 SongTex.compile 的结果；打开 GP 等文件时为 null
  let ukeView = null;
  let customScale = parseFloat(store.get('uk.cscale')) || (innerWidth < 640 ? 0.9 : 1.1);

  function customActive() { return !!compiled; }

  // alphaTab 一暂停就会「滚动到光标」（不管 scrollMode 是不是关了），
  // 而弹唱谱样式下它的谱在页面外，滚过去页面就跳走了，所以这时拦下来
  const alphaTabScrollToCursor = api.scrollToCursor.bind(api);
  api.scrollToCursor = () => { if (!customActive()) alphaTabScrollToCursor(); };

  function applyView() {
    const custom = customActive();
    document.querySelector('.paper').classList.toggle('custom', custom);
    // 看不见的 alphaTab 不能再带着页面滚动
    api.settings.player.scrollMode = custom ? alphaTab.ScrollMode.Off : alphaTab.ScrollMode.Continuous;
    api.updateSettings();
    showZoom();
  }

  // compiled 换了以后要等 alphaTab 解析完新谱（scoreLoaded）才能画，否则会拿旧 Score 配新数据
  let scoreFresh = false;
  function renderCustom() {
    if (!customActive() || !api.score || !scoreFresh) return;
    const song = compiled.song;
    $('ukeTitle').textContent = song.title;
    $('ukeSub').textContent = song.subtitle;
    $('ukeHeadL').innerHTML = '';
    for (const t of ['1 = ' + song.key.replace(/\d$/, '') + '　' + song.ts.join('/'), '♩ = ' + song.tempo].concat(song.capo ? ['Capo = ' + song.capo] : [])) {
      $('ukeHeadL').appendChild(document.createElement('div')).textContent = t;
    }
    $('ukeHeadR').textContent = song.artist;
    const box = $('ukeScore');
    ukeView = UkeRender.render(box, api.score, compiled, {
      scale: customScale,
      width: box.clientWidth,
      onSeek: (tick) => { api.tickPosition = scoreToPlayed(tick); ukeView.setTick(tick); selectBarLine(tick); },
      onRowChange: (svg, rowY, rowH) => {
        if (api.playerState !== alphaTab.synth.PlayerState.Playing) return;
        // 换行就把正在弹的这一行放到可视区（顶栏以下、播放条以上）的上方，下面几行都露出来
        const top = svg.getBoundingClientRect().top + rowY;
        const headerH = document.querySelector('header').offsetHeight;
        const visible = innerHeight - headerH - document.querySelector('.player').offsetHeight - 24;
        const target = headerH + Math.max(12, Math.min(visible * 0.15, visible - 2 * rowH));
        if (Math.abs(top - target) > 8) scrollTo({ top: scrollY + top - target, behavior: 'smooth' });
      },
    });
    ukeView.setTick(playedToScore(lastTick));
  }

  // 有反复记号时，播放位置（按实际演奏顺序展开后的 tick）和谱面位置不一样，
  // 用 alphaTab 生成 MIDI 时记下的「每小节实际从哪个 tick 开始」来换算
  function playedToScore(t) {
    const list = api.tickCache && api.tickCache.masterBars;
    if (!list || !list.length) return t;
    let lo = 0;
    let hi = list.length - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (list[mid].start <= t) lo = mid; else hi = mid - 1;
    }
    const mb = list[lo];
    return mb.masterBar.start + Math.min(t - mb.start, mb.end - mb.start - 1);
  }
  function scoreToPlayed(t) {
    if (!api.tickCache || !api.score) return t;
    let m = api.score.masterBars[0];
    for (const x of api.score.masterBars) if (x.start <= t) m = x;
    return api.tickCache.getMasterBarStart(m) + (t - m.start);
  }

  // 播放位置：alphaTab 的位置事件是一阵一阵来的（同一毫秒里几十个），
  // 所以用「最后一次的 tick + 按速度推算的增量」来画光标，速度由曲速直接算出
  let lastTick = 0;
  let lastTickAt = 0;
  api.playerPositionChanged.on((e) => {
    lastTick = e.currentTick;
    lastTickAt = performance.now();
    if (ukeView && customActive() && api.playerState !== alphaTab.synth.PlayerState.Playing) ukeView.setTick(playedToScore(lastTick));
  });
  (function frame() {
    if (ukeView && customActive() && api.playerState === alphaTab.synth.PlayerState.Playing && api.score) {
      const ticksPerMs = api.score.tempo * 960 / 60000 * api.playbackSpeed;
      ukeView.setTick(playedToScore(lastTick + Math.min(250, performance.now() - lastTickAt) * ticksPerMs));
    }
    requestAnimationFrame(frame);
  })();

  api.scoreLoaded.on(() => { scoreFresh = true; requestAnimationFrame(renderCustom); });
  let resizeTimer = 0;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderCustom, 200);
  });

  // ---------- 曲库 / 我的谱子 / 加载 ----------
  // 曲库：songs/ 打包进 library.js 的谱子（只读）。
  // 用户的东西（对曲库歌的修改、自己新建或导入的谱子）都通过 ScoreStore 存取，现在存在本浏览器，
  // 以后接云端只换 ScoreStore 的后端（见 scorestore.js）。
  const songs = window.SONGS || [];
  // current：正在看 / 写的是哪一份
  //   { kind: 'song', index }  曲库里的歌（改过的话，显示的是它的修改版）
  //   { kind: 'mine', id }     我的谱子
  //   { kind: 'new', name }    刚从模板新建、还没动过（一改就存成我的谱子）
  let current = { kind: 'song', index: 0 };
  let accompOverride = store.get('uk.accomp'); // null = 按谱子里写的
  let userRecs = new Map(); // ScoreStore 里的全部记录：id → 记录
  async function refreshUser() {
    userRecs = new Map((await ScoreStore.list()).map((r) => [r.id, r]));
  }
  const draftOf = (i) => userRecs.get(ScoreStore.draftId(songs[i].file));
  const myScores = () => [...userRecs.values()].filter((r) => r.kind === 'mine').sort((a, b) => b.updatedAt - a.updatedAt);
  const titleOf = (src) => { try { return SongTex.parse(src).title; } catch (e) { return ''; } };

  // 列表要显示的信息：乐器、调、拍号、速度、小节数，以及搜索用的歌词
  function metaOf(source, fallback, extraChips) {
    try {
      const p = SongTex.parse(source);
      return {
        title: p.title || fallback, artist: p.artist,
        chips: extraChips.concat([SongTex.INSTRUMENTS[p.instrument].name, '1 = ' + p.key.replace(/\d$/, ''), p.ts.join('/'), '♩ = ' + p.tempo, p.bars.length + ' 小节']),
        text: [fallback, p.title, p.artist, p.subtitle, ...p.bars.map((b) => b.lyrics.flat().join(''))].join(' ').toLowerCase(),
      };
    } catch (e) {
      return { title: fallback, artist: '', chips: ['格式有误'], text: fallback.toLowerCase() };
    }
  }
  const songMeta = songs.map((s) => metaOf(s.source, s.name, s.tutorial ? ['教程'] : []));
  const fullName = (m) => m.title + (m.artist ? ' - ' + m.artist : '');

  function buildSongList() {
    const kw = $('songSearch').value.trim().toLowerCase();
    const box = $('songList');
    box.innerHTML = '';
    const mine = myScores().map((r) => ({ r, m: metaOf(r.source, r.title || '未命名', ['我的']) })).filter((x) => !kw || x.m.text.includes(kw));
    const lib = songs.map((s, i) => ({ i, m: songMeta[i] })).filter((x) => !kw || x.m.text.includes(kw));
    $('songCount').textContent = '曲库（' + songs.length + ' 首）' + (myScores().length ? ' · 我的谱子（' + myScores().length + ' 首）' : '');
    const head = (t) => box.appendChild(Object.assign(document.createElement('div'), { className: 'list-head', textContent: t }));
    const item = (m, extra, isCur, open) => {
      const b = document.createElement('button');
      b.className = 'song-item' + (isCur ? ' cur' : '');
      const t = b.appendChild(document.createElement('div'));
      t.className = 't';
      t.textContent = m.title;
      if (m.artist) t.appendChild(Object.assign(document.createElement('span'), { className: 'a', textContent: m.artist }));
      const chips = b.appendChild(document.createElement('div'));
      chips.className = 'chips';
      for (const c of m.chips.concat(extra)) {
        const sp = chips.appendChild(document.createElement('span'));
        sp.className = 'chip' + (c === '本机改过' || c === '我的' ? ' draft' : '');
        sp.textContent = c;
      }
      b.addEventListener('click', async () => {
        await flushEdit();
        open();
        closeDrawers();
      });
      box.appendChild(b);
    };
    if (mine.length) {
      head('我的谱子（存在' + ScoreStore.info.name + '）');
      for (const { r, m } of mine) item(m, [], current.kind === 'mine' && current.id === r.id, () => loadMine(r.id));
      if (lib.length) head('曲库');
    }
    for (const { i, m } of lib) item(m, draftOf(i) ? ['本机改过'] : [], current.kind === 'song' && current.index === i, () => loadSong(i));
    if (!box.children.length) box.innerHTML = '<div class="empty">没有找到匹配的曲子</div>';
  }

  $('songBtn').addEventListener('click', () => {
    $('songSearch').value = '';
    buildSongList();
    openDrawer('songDrawer');
    // 手机上自动弹键盘会挡住列表，只在电脑上自动聚焦搜索框
    if (matchMedia('(pointer: fine)').matches) $('songSearch').focus();
  });
  $('songSearch').addEventListener('input', buildSongList);
  $('songSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const first = $('songList').querySelector('.song-item');
      if (first) first.click();
    }
  });

  // 地址栏：曲库的歌记下 #曲名（收藏或发给别人能直接打开这首）；我的谱子只在自己浏览器里，不放进地址
  function setHash(title) {
    try { history.replaceState(null, '', title ? '#' + encodeURIComponent(title) : location.pathname + location.search); } catch (e) { /* file:// 下可能不允许 */ }
  }
  function showSource(src, name) {
    $('songName').textContent = name;
    ed.value = src;
    ed.scrollTop = 0;
    updateGutter();
    applySource(src, false);
    buildExSel();
    updateEditButtons();
    showSaveState();
  }
  function loadSong(i) {
    current = { kind: 'song', index: i };
    store.set('uk.last', 'song:' + songs[i].name);
    setHash(songMeta[i].title);
    const d = draftOf(i);
    showSource(d ? d.source : songs[i].source, fullName(songMeta[i]));
  }
  function loadMine(id) {
    const r = userRecs.get(id);
    if (!r) return false;
    current = { kind: 'mine', id };
    store.set('uk.last', id);
    setHash('');
    showSource(r.source, r.title || '未命名');
    return true;
  }
  function newFromTemplate(t) {
    current = { kind: 'new', name: t.name };
    setHash('');
    showSource(t.source, t.name);
  }

  function applySource(src, save) {
    let res;
    try {
      res = SongTex.compile(src, accompOverride ? { accomp: accompOverride } : undefined);
    } catch (e) {
      renderMsgs([{ line: 0, msg: e.message }]);
      return;
    }
    renderMsgs(res.warnings);
    compiled = res;
    renderChips(res.song);
    setSeg('accompSeg', res.song.accomp);
    $('tabBtn').textContent = ({ 4: '四', 5: '五', 6: '六', 7: '七' }[res.song.tuning.length] || res.song.tuning.length) + '线谱';
    $('accompSeg').hidden = false;
    applyView();
    scoreFresh = false;
    if (save) saveCurrent(src);
    showStatus('正在排版…');
    api.tex(res.tex, [0, 1]);
  }

  function renderChips(song) {
    const box = $('chips');
    box.innerHTML = '';
    if (!song) return;
    const items = [
      SongTex.INSTRUMENTS[song.instrument].name + (song.capo ? ' 变调夹 ' + song.capo + ' 品' : ''),
      '1 = ' + song.key.replace(/\d$/, ''),
      song.ts.join('/'),
      '♩ = ' + song.tempo,
    ];
    if (song.chords.size) items.push('和弦 ' + [...song.chords.keys()].join(' '));
    for (const t of items) {
      const s = document.createElement('span');
      s.className = 'chip';
      s.textContent = t;
      box.appendChild(s);
    }
  }

  // 写谱栏底部的提示：按行号排，点一下跳到那一行
  function renderMsgs(list) {
    const box = $('msgs');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = '<span class="ok">✓ 没有发现问题</span>';
      return;
    }
    for (const w of list.slice().sort((a, b) => a.line - b.line)) {
      const b = document.createElement('button');
      b.textContent = (w.line ? '第 ' + w.line + ' 行：' : '') + w.msg;
      if (w.line) b.addEventListener('click', () => selectLine(w.line));
      box.appendChild(b);
    }
  }

  function setSeg(id, value) {
    $(id).querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.v === String(value)));
  }


  $('accompSeg').addEventListener('click', (e) => {
    const v = e.target.dataset && e.target.dataset.v;
    if (!v) return;
    accompOverride = v;
    store.set('uk.accomp', v);
    applySource($('src').value, false);
  });

  $('openBtn').addEventListener('click', () => $('fileIn').click());
  $('fileIn').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    e.target.value = '';
    if (f.name.split('.').pop().toLowerCase() !== 'txt') { alert('只能打开 .txt 谱子文件'); return; }
    await flushEdit();
    const text = await f.text();
    const id = ScoreStore.newId();
    try {
      await ScoreStore.put({ id, kind: 'mine', title: titleOf(text) || f.name.replace(/\.txt$/i, ''), source: text });
    } catch (err) {
      alert('导入失败：' + (err && err.message ? err.message : err));
      return;
    }
    await refreshUser();
    loadMine(id);
  });

  // ---------- 写谱栏 ----------
  // 左边写，停手半秒右边就重新排版（右边就是播放器本身，所以也能直接播放、调速）
  const ed = $('src');
  const pane = $('editPane');
  const setHeaderVar = () => document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px');
  setHeaderVar();
  addEventListener('resize', setHeaderVar);

  // ---------- 写谱栏：拖动调宽度、Ctrl+滚轮调字号 ----------
  const rootStyle = document.documentElement.style;
  const narrow = () => matchMedia('(max-width: 860px)').matches; // 窄屏时写谱栏在上面，拖的是高度
  let edFont = parseFloat(store.get('uk.edfs')) || 13;
  const edLine = () => Math.round(edFont * 1.62);
  function setEdFont(px) {
    edFont = Math.max(10, Math.min(28, px));
    rootStyle.setProperty('--edfs', edFont + 'px');
    rootStyle.setProperty('--edlh', edLine() + 'px');
    store.set('uk.edfs', String(edFont));
  }
  setEdFont(edFont);
  const savedW = parseFloat(store.get('uk.edw'));
  const savedH = parseFloat(store.get('uk.edh'));
  if (savedW) rootStyle.setProperty('--edw', savedW + 'px');
  if (savedH) rootStyle.setProperty('--edh', savedH + 'px');

  let relayoutTimer = 0;
  const relayout = () => {
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(() => { if (customActive()) renderCustom(); else api.render(); }, 120);
  };
  const resizer = $('resizer');
  resizer.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    resizer.setPointerCapture(e.pointerId);
    resizer.classList.add('drag');
    document.body.classList.add('resizing');
    const move = (ev) => {
      if (narrow()) {
        const h = Math.max(120, Math.min(innerHeight - 160, ev.clientY - pane.getBoundingClientRect().top));
        rootStyle.setProperty('--edh', h + 'px');
        store.set('uk.edh', String(h));
      } else {
        const w = Math.max(260, Math.min(innerWidth - 360, ev.clientX));
        rootStyle.setProperty('--edw', w + 'px');
        store.set('uk.edw', String(w));
      }
      relayout(); // 谱面跟着重新排（拖动时会节流）
    };
    const up = () => {
      resizer.classList.remove('drag');
      document.body.classList.remove('resizing');
      resizer.removeEventListener('pointermove', move);
      resizer.removeEventListener('pointerup', up);
      relayout();
    };
    resizer.addEventListener('pointermove', move);
    resizer.addEventListener('pointerup', up);
  });
  // 双击拖动条：恢复默认大小
  resizer.addEventListener('dblclick', () => {
    rootStyle.removeProperty('--edw');
    rootStyle.removeProperty('--edh');
    store.del('uk.edw');
    store.del('uk.edh');
    relayout();
  });

  // Ctrl + 滚轮：鼠标在写谱栏上 → 改写谱字号；在谱面上 → 缩放谱子（不让浏览器整页缩放）
  addEventListener('wheel', (e) => {
    if (!e.ctrlKey) return;
    const onEditor = pane.contains(e.target);
    const onScore = !!e.target.closest('main');
    if (!onEditor && !onScore) return;
    e.preventDefault();
    const dir = e.deltaY < 0 ? 1 : -1;
    if (onEditor) {
      setEdFont(edFont + dir);
      updateGutter();
    } else {
      setScale(curScale() + dir * 0.1);
    }
  }, { passive: false });

  function setEditing(on) {
    pane.hidden = !on;
    document.body.classList.toggle('editing', on);
    $('editBtn').classList.toggle('on', on);
    store.set('uk.editing', on ? '1' : '');
    setHeaderVar();
    updateGutter();
    // 谱面可用宽度变了，重新排
    setTimeout(() => { if (customActive()) renderCustom(); else api.render(); }, 50);
  }
  $('editBtn').addEventListener('click', () => setEditing(pane.hidden));
  $('editClose').addEventListener('click', () => setEditing(false));

  // 行号 + 上色（每次改动都重画，一首歌一两百行，很快）
  function updateGutter() {
    const lines = ed.value.split('\n');
    let s = '';
    for (let i = 1; i <= lines.length; i++) s += i + '\n';
    $('gutter').textContent = s;
    $('hl').innerHTML = lines.map(hlLine).join('\n') + '\n';
    syncScroll();
  }
  const esc = (t) => t.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const KEY_RE = /^(\s*)(title|artist|subtitle|key|tempo|time|tuning|capo|melody|instrument|accomp|chord|strum|pattern|ending)\b/;
  function hlLine(l) {
    // # ════ 分段 ════ 整行做成一条橙色横条
    if (/^\s*#\s*[═=━─-]{3}/.test(l)) return '<span class="hl-sep">' + esc(l) + '</span>';
    let code = l;
    let cmt = '';
    const m = /(^|\s)(#\s.*)$/.exec(l);
    if (m) { code = l.slice(0, m.index + m[1].length); cmt = m[2]; }
    let h;
    if (/^\s*(\[.+\]|\|:|:\|.*)\s*$/.test(code)) {
      h = '<span class="hl-sec">' + esc(code) + '</span>'; // 段落名、反复记号
    } else if (KEY_RE.test(code)) {
      h = code.replace(KEY_RE, (all, sp, k) => sp + '\u0000' + k + '\u0001');
      h = esc(h).replace('\u0000', '<span class="hl-key">').replace('\u0001', '</span>');
    } else {
      h = esc(code).replace(/\|/g, '<span class="hl-bar">|</span>'); // 小节行的分隔符
    }
    return h + (cmt ? '<span class="hl-cmt">' + esc(cmt) + '</span>' : '');
  }
  function syncScroll() {
    $('gutter').scrollTop = ed.scrollTop;
    $('hl').scrollTop = ed.scrollTop;
    $('hl').scrollLeft = ed.scrollLeft;
  }
  ed.addEventListener('scroll', syncScroll);
  let editTimer = 0;
  ed.addEventListener('input', () => {
    updateGutter();
    clearTimeout(editTimer);
    editTimer = setTimeout(() => { editTimer = 0; applySource(ed.value, true); }, 500);
  });
  ed.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
  });

  // 选中第 lineNo 行，并滚到写谱栏中间
  function selectLine(lineNo) {
    if (!lineNo) return;
    if (pane.hidden) setEditing(true);
    const lines = ed.value.split('\n');
    if (lineNo > lines.length) return;
    let start = 0;
    for (let i = 0; i < lineNo - 1; i++) start += lines[i].length + 1;
    ed.focus();
    ed.setSelectionRange(start, start + lines[lineNo - 1].length);
    ed.scrollTop = Math.max(0, (lineNo - 1) * edLine() - ed.clientHeight / 2);
  }
  // 谱面上点了某个小节 → 左边选中写这个小节的那一行
  function selectBarLine(scoreTick) {
    if (pane.hidden || !compiled || !api.score) return;
    let idx = 0;
    api.score.masterBars.forEach((m, i) => { if (m.start <= scoreTick) idx = i; });
    const bar = compiled.song.bars[idx];
    if (bar) selectLine(bar.lineNo);
  }
  // 左边光标停在某个小节的那一行 → 右边高亮那个小节
  function caretToBar() {
    if (!compiled || !ukeView || !api.score || api.playerState === alphaTab.synth.PlayerState.Playing) return;
    const lineNo = ed.value.slice(0, ed.selectionStart).split('\n').length;
    const i = compiled.song.bars.findIndex((b) => b.lineNo === lineNo);
    if (i >= 0 && api.score.masterBars[i]) ukeView.setTick(api.score.masterBars[i].start);
  }
  ed.addEventListener('click', caretToBar);
  ed.addEventListener('keyup', (e) => { if (e.key.startsWith('Arrow') || e.key === 'Enter') caretToBar(); });

  // ---------- 写谱栏的谱子选择 ----------
  // 列出 songs/ 里的全部谱子（文件名以「教程」开头的写法教程排在最前），外加两个新建空白谱子的模板
  const NEW_TEMPLATES = [
    { name: '新建空白谱子（尤克里里）', source: String.raw`title: 新歌
artist:
key: C
tempo: 80
time: 4/4
strum: D D_ D__ U__ D D_ D__ U__

# ════════ 主歌 ════════
C | 1 2 3 4 |
` },
    { name: '新建空白谱子（吉他）', source: String.raw`title: 新歌
artist:
instrument: guitar
key: C
tempo: 80
time: 4/4
strum: B D_ U_ B D_ U_

# ════════ 主歌 ════════
C | 1 2 3 4 |
` },
  ];
  const exSel = $('exSel');
  // 下拉框：教程 / 曲库 / 我的谱子 / 新建，并显示当前打开的是哪一份（每次换谱、保存后重建）
  function buildExSel() {
    exSel.innerHTML = '';
    exSel.add(new Option(current.kind === 'new' ? current.name + '（还没改动）' : '选择谱子…', ''));
    const group = (label, items) => {
      if (!items.length) return;
      const g = document.createElement('optgroup');
      g.label = label;
      for (const [text, value] of items) g.appendChild(new Option(text, value));
      exSel.appendChild(g);
    };
    const tutorials = [];
    const library = [];
    songs.forEach((s, i) => (s.tutorial ? tutorials : library).push([fullName(songMeta[i]), 'song:' + i]));
    group('教程', tutorials);
    group('曲库', library);
    group('我的谱子', myScores().map((r) => [r.title || '未命名', r.id]));
    group('新建', NEW_TEMPLATES.map((t, k) => [t.name, 'new:' + k]));
    exSel.value = current.kind === 'song' ? 'song:' + current.index : current.kind === 'mine' ? current.id : '';
  }
  exSel.addEventListener('change', async () => {
    const v = exSel.value;
    buildExSel(); // 先恢复显示当前这份，存好再换
    if (!v) return;
    await flushEdit();
    if (v.startsWith('song:')) loadSong(Number(v.slice(5)));
    else if (v.startsWith('new:')) newFromTemplate(NEW_TEMPLATES[Number(v.slice(4))]);
    else loadMine(v);
  });

  // ---------- 自动保存 ----------
  // 写谱时停手半秒就存（存到 ScoreStore，现在是本浏览器）。曲库的歌存成它的「修改版」，改回和原版一样就删掉修改版；
  // 新建的谱子第一次改动时变成「我的谱子」
  let saveError = '';
  async function saveCurrent(src) {
    const target = current;
    try {
      if (target.kind === 'song') {
        const s = songs[target.index];
        const id = ScoreStore.draftId(s.file);
        if (src === s.source) await ScoreStore.remove(id);
        else await ScoreStore.put({ id, kind: 'draft', base: s.file, title: songMeta[target.index].title, source: src });
      } else {
        const title = titleOf(src) || '未命名';
        const id = target.kind === 'mine' ? target.id : ScoreStore.newId();
        await ScoreStore.put({ id, kind: 'mine', title, source: src });
        if (current === target) {
          if (target.kind === 'new') { current = { kind: 'mine', id }; store.set('uk.last', id); }
          $('songName').textContent = title;
        }
      }
      saveError = '';
    } catch (e) {
      saveError = '保存失败：' + (e && e.message ? e.message : e) + '（可以先「另存为」保住内容）';
    }
    await refreshUser();
    buildExSel();
    updateEditButtons();
    showSaveState();
  }
  // 换谱子、导入、关页面之前：编辑器里还没来得及自动保存的改动先存掉
  async function flushEdit() {
    if (!editTimer) return;
    clearTimeout(editTimer);
    editTimer = 0;
    await saveCurrent(ed.value);
  }
  addEventListener('pagehide', () => { flushEdit(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushEdit(); });

  function updateEditButtons() {
    $('resetBtn').hidden = !(current.kind === 'song' && draftOf(current.index));
    $('delBtn').hidden = current.kind !== 'mine';
  }
  function showSaveState() {
    const box = $('saveState');
    box.className = 'save-state' + (saveError ? ' err' : '');
    box.title = ScoreStore.info.hint;
    const where = ScoreStore.info.name;
    const at = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (saveError) box.textContent = saveError;
    else if (current.kind === 'new') box.textContent = '新谱子：一改动就自动保存到「我的谱子」（' + where + '）';
    else if (current.kind === 'song') {
      const d = draftOf(current.index);
      box.textContent = d ? '你的修改已自动保存在' + where + ' · ' + at(d.updatedAt) + '（「恢复原版」可撤销）' : '曲库原版 · 改动会自动保存在' + where;
    } else {
      const r = userRecs.get(current.id);
      box.textContent = '我的谱子 · 已自动保存在' + where + (r ? ' · ' + at(r.updatedAt) : '');
    }
  }

  // 另存为：存成 .txt 放到用户自己的设备上；第一行带上出处（已经有了就不重复加）
  const TXT_CREDIT = '# 用「弹唱谱」制作 · 非商用 · https://github.com/guihuajiankangoo';
  function saveAsTxt() {
    const title = (compiled && compiled.song.title) || $('songName').textContent || '新谱子';
    const text = ed.value.includes('github.com/guihuajiankangoo') ? ed.value : TXT_CREDIT + '\n' + ed.value;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = title.replace(/[\\/:*?"<>|]/g, '') + '.txt';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('saveAsBtn').addEventListener('click', saveAsTxt);
  $('resetBtn').addEventListener('click', async () => {
    if (current.kind !== 'song') return;
    if (!confirm('放弃你对这首歌的修改，恢复曲库原版？')) return;
    clearTimeout(editTimer);
    editTimer = 0;
    await ScoreStore.remove(ScoreStore.draftId(songs[current.index].file));
    await refreshUser();
    loadSong(current.index);
  });
  $('delBtn').addEventListener('click', async () => {
    if (current.kind !== 'mine') return;
    const r = userRecs.get(current.id);
    if (!confirm('删除「' + ((r && r.title) || '未命名') + '」？\n删除后找不回来，需要的话先「另存为」。')) return;
    clearTimeout(editTimer);
    editTimer = 0;
    await ScoreStore.remove(current.id);
    await refreshUser();
    if (songs.length) loadSong(0);
    else newFromTemplate(NEW_TEMPLATES[0]);
  });

  // 旧版本把曲库歌的修改存成 uk.draft.<歌名>、新建的存成 uk.scratch，搬进 ScoreStore 后删掉旧的
  async function migrateLegacy() {
    let keys = [];
    try { keys = Object.keys(localStorage).filter((k) => k.startsWith('uk.draft.') || k === 'uk.scratch'); } catch (e) { return; }
    for (const k of keys) {
      const src = store.get(k);
      const i = songs.findIndex((s) => 'uk.draft.' + s.name === k);
      try {
        if (src && i >= 0 && src !== songs[i].source) {
          await ScoreStore.put({ id: ScoreStore.draftId(songs[i].file), kind: 'draft', base: songs[i].file, title: songMeta[i].title, source: src });
        } else if (src && i < 0 && !NEW_TEMPLATES.some((t) => t.source === src)) {
          // 找不到对应的曲库歌（比如改过名）：当成我的谱子留着，不丢
          await ScoreStore.put({ id: ScoreStore.newId(), kind: 'mine', title: titleOf(src) || '未命名', source: src });
        }
        store.del(k);
      } catch (e) { /* 存不进去就先留着旧的，下次再搬 */ }
    }
  }

  // ---------- 抽屉 ----------
  const scrim = $('scrim');
  function openDrawer(id) {
    document.querySelectorAll('.drawer').forEach((d) => d.classList.toggle('open', d.id === id));
    scrim.classList.add('show');
  }
  function closeDrawers() {
    document.querySelectorAll('.drawer').forEach((d) => d.classList.remove('open'));
    scrim.classList.remove('show');
  }
  scrim.addEventListener('click', closeDrawers);
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeDrawers));

  // ---------- 音量：伴奏、旋律分开调 ----------
  // 按声部名字记（「尤克里里」「吉他」「旋律」），所以换歌也沿用；值是倍数，1 = 原音量，0 = 静音
  const VOL_LABEL = { '尤克里里': '伴奏', '吉他': '伴奏', '旋律': '旋律' };
  let volumes = {};
  try { volumes = JSON.parse(store.get('uk.vol') || '{}') || {}; } catch (e) { volumes = {}; }
  const volOf = (t) => (volumes[t.name] != null ? volumes[t.name] : 1);
  const lastVol = {}; // 点静音前的音量，再点一次恢复

  function setVolume(t, v) {
    volumes[t.name] = v;
    store.set('uk.vol', JSON.stringify(volumes));
    api.changeTrackVolume([t], v);
  }
  function applyVolumes() {
    if (!api.score) return;
    for (const t of api.score.tracks) api.changeTrackVolume([t], volOf(t));
  }
  // 每次换歌 alphaTab 会重新生成播放数据，音量要重新设一次。
  // （不能订阅 api.midiLoaded：alphaTab 1.8.4 订阅时会无限递归报错）
  // 保险起见每次开始播放前也设一遍，开销很小
  api.scoreLoaded.on(() => setTimeout(applyVolumes, 0));
  api.playerReady.on(applyVolumes);
  api.playerStateChanged.on((e) => { if (e.state === alphaTab.synth.PlayerState.Playing) applyVolumes(); });

  function buildVolRows() {
    const box = $('volRows');
    box.innerHTML = '';
    if (!api.score) return;
    for (const t of api.score.tracks) {
      const row = document.createElement('div');
      row.className = 'vrow';
      row.innerHTML =
        '<span class="vname"></span>' +
        '<input type="range" min="0" max="1.5" step="0.05">' +
        '<span class="vval"></span>' +
        '<button class="btn icon" title="静音 / 取消静音"><svg class="i"><use href="#i-vol"/></svg></button>';
      row.querySelector('.vname').textContent = VOL_LABEL[t.name] || t.name || ('声部 ' + (t.index + 1));
      const range = row.querySelector('input');
      const val = row.querySelector('.vval');
      const mute = row.querySelector('button');
      const show = () => {
        const v = volOf(t);
        range.value = v;
        val.textContent = Math.round(v * 100) + '%';
        mute.classList.toggle('on', v === 0);
        mute.querySelector('use').setAttribute('href', v === 0 ? '#i-mute' : '#i-vol');
      };
      range.addEventListener('input', () => { setVolume(t, parseFloat(range.value)); show(); });
      mute.addEventListener('click', () => {
        if (volOf(t) > 0) { lastVol[t.name] = volOf(t); setVolume(t, 0); }
        else setVolume(t, lastVol[t.name] || 1);
        show();
      });
      show();
      box.appendChild(row);
    }
  }

  $('volBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const pop = $('volPop');
    pop.hidden = !pop.hidden;
    $('volBtn').classList.toggle('on', !pop.hidden);
    if (!pop.hidden) buildVolRows();
  });
  $('volReset').addEventListener('click', () => {
    volumes = {};
    store.del('uk.vol');
    applyVolumes();
    buildVolRows();
  });
  // 点面板外面就收起
  document.addEventListener('click', (e) => {
    const pop = $('volPop');
    if (!pop.hidden && !pop.contains(e.target) && e.target !== $('volBtn')) {
      pop.hidden = true;
      $('volBtn').classList.remove('on');
    }
  });

  // ---------- 播放控制 ----------
  const playBtn = $('playBtn');
  playBtn.addEventListener('click', () => api.playPause());
  $('stopBtn').addEventListener('click', () => api.stop());
  // ---------- 速度：直接按「每分钟多少拍」调 ----------
  // 播放器只认倍率，所以 倍率 = 设的拍速 ÷ 谱子原来的拍速；换歌时回到原速
  const bpmIn = $('bpm');
  const scoreTempo = () => (api.score && api.score.tempo) || 80;
  function setBpm(v) {
    const bpm = Math.max(20, Math.min(300, Math.round(v) || scoreTempo()));
    bpmIn.value = bpm;
    api.playbackSpeed = bpm / scoreTempo();
    bpmIn.classList.toggle('changed', bpm !== scoreTempo());
  }
  // 换了一首谱子、或者谱子里的 tempo 改了，才回到原速；同一首边改边听时保留调过的速度
  let bpmKey = '';
  api.scoreLoaded.on(() => {
    const key = JSON.stringify([current.kind, current.index, current.id, current.name]) + '@' + scoreTempo();
    setBpm(key === bpmKey ? parseInt(bpmIn.value, 10) : scoreTempo());
    bpmKey = key;
  });
  $('bpmDown').addEventListener('click', () => setBpm(parseInt(bpmIn.value, 10) - 5));
  $('bpmUp').addEventListener('click', () => setBpm(parseInt(bpmIn.value, 10) + 5));
  bpmIn.addEventListener('change', () => setBpm(parseInt(bpmIn.value, 10)));
  bpmIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') bpmIn.blur(); });
  bpmIn.addEventListener('dblclick', () => setBpm(scoreTempo()));

  const toggle = (id, get, set) => {
    const b = $(id);
    b.addEventListener('click', () => { set(!get()); b.classList.toggle('on', get()); });
  };
  toggle('metroBtn', () => api.metronomeVolume > 0, (v) => { api.metronomeVolume = v ? 1 : 0; });
  toggle('countBtn', () => api.countInVolume > 0, (v) => { api.countInVolume = v ? 1 : 0; });
  toggle('loopBtn', () => api.isLooping, (v) => { api.isLooping = v; });

  // 两种样式各记各的缩放：alphaTab 的谱比较密，手机上要缩到 0.6；自绘的按手机字号设计，不用缩那么多
  const curScale = () => (customActive() ? customScale : api.settings.display.scale);
  const showZoom = () => { $('zoomVal').textContent = Math.round(curScale() * 100) + '%'; };
  function setScale(s) {
    s = Math.max(0.5, Math.min(2, Math.round(s * 10) / 10));
    if (customActive()) {
      customScale = s;
      store.set('uk.cscale', String(s));
      renderCustom();
    } else {
      api.settings.display.scale = s;
      store.set('uk.scale', String(s));
      api.updateSettings();
      api.render();
    }
    showZoom();
  }
  showZoom();
  $('zoomIn').addEventListener('click', () => setScale(curScale() + 0.1));
  $('zoomOut').addEventListener('click', () => setScale(curScale() - 0.1));

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) {
      e.preventDefault();
      api.playPause();
    }
  });

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  };
  let seeking = false;
  let endTime = 0;
  api.playerPositionChanged.on((e) => {
    endTime = e.endTime;
    $('time').textContent = fmt(e.currentTime) + ' / ' + fmt(e.endTime);
    if (!seeking && e.endTime > 0) $('progress').value = Math.round(e.currentTime / e.endTime * 1000);
  });
  const prog = $('progress');
  prog.addEventListener('input', () => { seeking = true; });
  prog.addEventListener('change', () => {
    if (endTime > 0) api.timePosition = prog.value / 1000 * endTime;
    seeking = false;
  });

  // 播放时不让手机/平板自动锁屏（浏览器支持 Wake Lock 才生效，不支持就算了）
  let wakeLock = null;
  async function keepAwake(on) {
    try {
      if (on && !wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!on && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { /* 省电模式等情况下可能被拒绝，不影响播放 */ }
  }
  // 切到后台再回来时，常亮会被系统收回，还在播放就重新申请
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && api.playerState === alphaTab.synth.PlayerState.Playing) keepAwake(true);
  });

  api.playerStateChanged.on((e) => {
    const playing = e.state === alphaTab.synth.PlayerState.Playing;
    playBtn.querySelector('use').setAttribute('href', playing ? '#i-pause' : '#i-play');
    keepAwake(playing);
    // 播放时自动收起成一条，暂停就展开
    document.querySelector('.player').classList.toggle('mini', playing);
  });
  $('expandBtn').addEventListener('click', () => document.querySelector('.player').classList.remove('mini'));
  api.soundFontLoad.on((e) => {
    $('sfInfo').textContent = e.total > e.loaded
      ? '音色加载 ' + Math.floor(e.loaded / e.total * 100) + '%'
      : '音色加载 ' + Math.round(e.loaded / 1024) + ' KB';
  });
  api.playerReady.on(() => {
    playBtn.disabled = false;
    $('sfInfo').textContent = '';
  });
  api.renderStarted.on(() => showStatus(''));
  api.renderFinished.on(() => showStatus(''));
  api.scoreLoaded.on(() => showStatus(''));
  api.error.on((e) => {
    console.error(e);
    showStatus('出错了：' + (e && e.message ? e.message : e));
  });

  // ---------- 署名横幅 ----------
  // 本机、作者自己的网址、临时隧道上不显示；别处部署的显示一条署名（不影响使用，关掉后下次打开还会出现）
  (function () {
    const h = location.hostname;
    const own = !h || h === 'localhost' || h === '127.0.0.1' || h === 'guihuajiankangoo.github.io' || h.endsWith('.trycloudflare.com');
    if (own) return;
    $('credBanner').hidden = false;
    $('credClose').addEventListener('click', () => { $('credBanner').hidden = true; setHeaderVar(); });
    setHeaderVar();
  })();

  // ---------- 启动 ----------
  (async function start() {
    await migrateLegacy();
    await refreshUser();
    // 优先按地址栏 #曲名 打开，其次是上次看的那份（曲库的歌或我的谱子），都没有就打开第一首
    const byName = (name) => songs.findIndex((s, i) => s.name === name || songMeta[i].title === name);
    const hashIdx = byName(decodeURIComponent(location.hash.slice(1)));
    const last = store.get('uk.last') || (store.get('uk.song') ? 'song:' + store.get('uk.song') : '');
    if (hashIdx >= 0) loadSong(hashIdx);
    else if (last.startsWith('mine:') && loadMine(last)) { /* 打开了上次的我的谱子 */ }
    else if (songs.length) {
      // 第一次来：打开演示歌，没有就打开第一首不是教程的
      const i = last.startsWith('song:') ? byName(last.slice(5)) : -1;
      const featured = songs.findIndex((x) => x.featured);
      const firstSong = songs.findIndex((x) => !x.tutorial);
      loadSong(i >= 0 ? i : featured >= 0 ? featured : Math.max(0, firstSong));
    } else newFromTemplate(NEW_TEMPLATES[0]);
    if (store.get('uk.editing')) setEditing(true); // 上次开着写谱栏，就接着开
    // 同一个页面里点了别的「#曲名」链接：浏览器不会重新加载，这里换歌
    addEventListener('hashchange', async () => {
      const i = byName(decodeURIComponent(location.hash.slice(1)));
      if (i < 0 || (current.kind === 'song' && current.index === i)) return;
      await flushEdit();
      loadSong(i);
    });
  })();
})();
</script>
</body>
</html>
